  /* ================= ТВОИ СТИЛИ ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #070312; --bg-2: #0f0721; --card: #150b2a; --card-2: #1c1038;
    --border: #2a1852; --border-hi: #3d2470;
    --accent: #a855f7; --accent-light: #c084fc; --accent-dark: #7c3aed;
    --text: #ffffff; --muted: #9a8fb0;
    --green: #10b981; --red: #ef4444; --blue: #3b82f6; --yellow: #f59e0b;
  }
  
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.5; overflow-x: hidden;
    min-height: 100vh; position: relative;
  }

  body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(circle at 10% 20%, rgba(168,85,247,0.15), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139,92,246,0.15), transparent 40%);
    z-index: -1; pointer-events: none;
  }

  nav {
    background: rgba(21, 11, 42, 0.8); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
  }
  .nav-inner {
    max-width: 1400px; margin: 0 auto; padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .logo {
    font-size: 28px; font-weight: 900; letter-spacing: 1px;
    background: linear-gradient(90deg, #fff, var(--accent-light));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-decoration: none; cursor: pointer;
  }
  .nav-links { display: flex; gap: 8px; list-style: none; align-items: center; }
  .nav-links a {
    color: #d1c8e3; text-decoration: none; font-size: 14px; font-weight: 600;
    padding: 6px 12px; border-radius: 6px; transition: 0.2s;
  }
  .nav-links a:hover { color: var(--accent-light); background: rgba(255,255,255,0.05); }
  
  .online-badge {
    background: rgba(16, 185, 129, 0.15); color: var(--green);
    padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; gap: 6px; border: 1px solid rgba(16, 185, 129, 0.3);
  }
  .online-badge::before {
    content: ''; width: 6px; height: 6px; background: var(--green);
    border-radius: 50%; animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.3; } }

  .btn {
    padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 700;
    cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center;
    text-decoration: none; transition: 0.25s; font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(180deg, #b16cf9 0%, #8b31f5 100%); color: #fff;
    box-shadow: 0 4px 15px rgba(124,58,237,0.4);
  }
  .btn-hero {
    background: linear-gradient(180deg, #e9d5ff 0%, #a78bfa 100%);
    color: #1e0f37; padding: 12px 24px; border-radius: 8px; font-weight: 800;
    text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 15px rgba(167,139,250,0.4);
  }

  .main-container { max-width: 1400px; margin: 24px auto; padding: 0 24px; display: flex; flex-direction: column; gap: 24px; }
  .top-banners { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .banner-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  .banner-card h3 { font-size: 16px; margin-bottom: 4px; }
  .banner-card p { color: var(--muted); font-size: 13px; }
  .banner-icon { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .tg-icon { background: linear-gradient(180deg, #2AABEE, #229ED9); }
  .dc-icon { background: linear-gradient(180deg, #5865F2, #4752C4); }

  .middle-grid { display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
  .donators-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  .donators-header { font-size: 14px; font-weight: 700; margin-bottom: 16px; }
  .donator-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .donator-item:last-child { border-bottom: none; }

  .donator-name { font-size: 14px; font-weight: 700; }
  .donator-name.gold { color: #fbbf24; }
  .donator-name.purple { color: #d8b4fe; }
  .donator-desc { font-size: 11px; color: var(--muted); }
  .donator-rank { font-size: 24px; font-weight: 900; color: var(--border-hi); font-style: italic; }

  .hero-slider {
    background: linear-gradient(135deg, #1e0f37, #0f0721); border: 1px solid var(--border);
    border-radius: 16px; position: relative; overflow: hidden; display: flex; flex-direction: column;

  .hero-bg {
    position: absolute; inset: 0; z-index: 1;
    background: radial-gradient(circle at 70% 30%, rgba(168,85,247,0.4), transparent 50%),

  .hero-content h1 { font-size: 36px; font-weight: 800; margin-bottom: 12px; }
  .hero-content p { color: #d1c8e3; margin-bottom: 24px; font-size: 15px; }

  .servers-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .server-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; position: relative; aspect-ratio: 3/4; cursor: pointer; transition: 0.2s;
  }
  .server-card:hover { transform: translateY(-4px); border-color: var(--accent); }
  .server-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 100px; opacity: 0.8; }
  .bg-public { background: linear-gradient(180deg, #1c1038 0%, #0a0416 100%); } .bg-public::after { content: '🕵️'; }
  .bg-fun { background: linear-gradient(180deg, #2a1b4d 0%, #0a0416 100%); } .bg-fun::after { content: '🤪'; }
  .bg-sand { background: linear-gradient(180deg, #3d2470 0%, #0a0416 100%); } .bg-sand::after { content: '🏜️'; }
  .bg-duels { background: linear-gradient(180deg, #1e0f37 0%, #0a0416 100%); } .bg-duels::after { content: '⚔️'; }

  .server-content { position: absolute; inset: 0; z-index: 2; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(to top, rgba(10,4,22,0.95) 0%, transparent 50%); }
  .server-title { font-size: 16px; font-weight: 800; text-transform: uppercase; }
  .server-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--green); font-weight: 600; }
  .server-status::before { content: ''; width: 6px; height: 6px; background: var(--green); border-radius: 50%; }

  /* ================= АДАПТАЦИЯ ПОД ТЕЛЕФОНЫ ================= */
  @media (max-width: 1024px) {
    .servers-grid { grid-template-columns: repeat(3, 1fr); }
    .middle-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 768px) {
    .top-banners { grid-template-columns: 1fr; }
    .servers-grid { grid-template-columns: repeat(2, 1fr); }
    .nav-inner { flex-direction: column; gap: 12px; padding: 12px; }
    .nav-links { flex-wrap: wrap; justify-content: center; }
    .hero-content h1 { font-size: 26px; }
    .hero-slider { padding: 24px; min-height: 250px; }
    .main-container { margin: 16px auto; padding: 0 16px; }
  }

  /* ================= WOW PACK СТИЛИ ================= */
  :root{ --accent-2:#22d3ee; --muted:#b8aed0; }
  body::after{ content:''; position:fixed; inset:0; pointer-events:none; z-index:0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45) 100%); }
  .online-badge{ border-color: rgba(34,211,238,.35); color:#67e8f9; }
  .online-badge::before{ background:#22d3ee; box-shadow:0 0 8px #22d3ee; }
  
  .server-card::before{
    content:''; position:absolute; inset:-1px; border-radius:16px; z-index:0;
    background: conic-gradient(from var(--a,0deg), transparent 0%, #a855f7 15%, #22d3ee 30%, transparent 45%, transparent 100%);
    animation: spin 4s linear infinite; opacity:0; transition:opacity .3s;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding:1px;
  }
  .server-card:hover::before{ opacity:1; }
  .server-card > *{ position:relative; z-index:1; }
  @property --a{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
  @keyframes spin{ to{ --a:360deg; } }

  .reveal{ opacity:0; transform: translateY(30px) scale(.98); }
  .reveal.in{ animation: pageEnter .7s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes pageEnter { 0% { opacity: 0; transform: translateY(30px) scale(1.01); } 100% { opacity: 1; transform: none; } }
</style>
</head>

const $ = (id) => document.getElementById(id);

function escapeHtml(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
  return String(text).replace(/[&<>"']/g, (m) => map[m]);
}

function renderServer(s) {
  const status = s.players === 0
    ? 'empty'
    : (s.players >= s.max ? 'full' : '');

  const percent = Math.min(100, Math.round((s.players / s.max) * 100));

  let badge = '';

  if (s.players >= s.max) {
    badge = '<span class="server-badge full">FULL</span>';
  } else if (s.players >= s.max * 0.7) {
    badge = '<span class="server-badge hot">HOT</span>';
  }

  return `
    <a
      class="server-card"
      href="steam://connect/${escapeHtml(s.ip)}"
      title="Подключиться: ${escapeHtml(s.ip)}"
    >
      <div class="server-bg bg-${escapeHtml(s.bg)}"></div>

      <div class="server-content">
        <div>
          <div class="server-topline">
            <div class="server-title">${escapeHtml(s.name)}</div>
            ${badge}
          </div>

          <div class="server-map">
            CS2 · ${escapeHtml(s.ip)}
          </div>
        </div>

        <div class="server-bottom">
          <div class="server-connect">▶ Подключиться</div>

          <div class="server-status ${status}">
            ${s.players}/${s.max}
          </div>

          <div class="server-progress">
            <span style="width:${percent}%"></span>
          </div>
        </div>
      </div>

      <button
        class="server-copy"
        onclick="copyServerIp(event, '${escapeHtml(s.ip)}')"
        title="Скопировать IP"
        aria-label="Скопировать IP"
      >⧉</button>
    </a>
  `;
}
function getTotalOnline() {
  return SERVERS.reduce((sum, server) => sum + server.players, 0);
}

function getTotalSlots() {
  return SERVERS.reduce((sum, server) => sum + server.max, 0);
}

function getMostPopularServer() {
  return SERVERS.reduce((best, server) => {
    return server.players > best.players ? server : best;
  }, SERVERS[0]);
}

function copyServerIp(event, ip) {
  event.preventDefault();
  event.stopPropagation();

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(ip)
      .then(() => showToast(`IP скопирован: ${ip}`))
      .catch(() => showToast(ip));

    return;
  }

  const input = document.createElement('textarea');
  input.value = ip;
  input.style.position = 'fixed';
  input.style.opacity = '0';

  document.body.appendChild(input);
  input.select();

  try {
    document.execCommand('copy');
    showToast(`IP скопирован: ${ip}`);
  } catch (error) {
    showToast(ip);
  }

  input.remove();
}

const pageRoot = $('page-root');
let currentPath = null;
let leaveTimer = null;

function parseHash() {
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, query] = raw.split('?');
  return { path: path || '/', query: query || '' };
}

function renderPage(animate) {
  let { path, query } = parseHash();
  if (!pages[path]) path = '/404';

  const draw = () => {
    if (path === '/') slideIndex = 0;
    pageRoot.className = path === '/' ? 'main-container' : '';
    pageRoot.innerHTML = pages[path]();
    if (animate) {
      void pageRoot.offsetWidth;
      pageRoot.classList.add('entering');
      setTimeout(() => pageRoot.classList.remove('entering'), 750);
    }
    window.scrollTo({ top: 0, behavior: 'instant' });
    document.querySelectorAll('.nav-links a').forEach((a) => {
      a.classList.toggle('active', a.dataset.route === path);
    });
    stopFreeTimer();
    if (path === '/shop' && query === 'cases') switchShopTab('cases');
    currentPath = path;
  };

  if (!animate || currentPath === null) return draw();
  clearTimeout(leaveTimer);
  pageRoot.classList.add('leaving');
  leaveTimer = setTimeout(draw, 340);
}

function setDonatorsPeriod(period) {

function changeSlide(dir) {
  slideIndex = (slideIndex + dir + SLIDES.length) % SLIDES.length;
  const el = $('heroContent');
  el.innerHTML = renderSlide(slideIndex);
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
}

function showToast(msg, type) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('error', type === 'error');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

function switchShopTab(tab) {
  const shopDiv = $('tab-shop');
  const casesDiv = $('tab-cases');
  if (!shopDiv || !casesDiv) return;
  document.querySelectorAll('.shop-tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === tab));

  if (tab === 'cases') startFreeTimer(); else stopFreeTimer();

/* =====================================================================
   БЕСПЛАТНЫЙ КЕЙС
   Внимание: таймер в localStorage и розыгрыш в браузере легко обойти.
   Для реальной выдачи призов розыгрыш нужно перенести на сервер.
   ===================================================================== */
function getLastFreeOpen() { try { return Number(localStorage.getItem(FREE_CASE_KEY)) || 0; } catch (e) { return 0; } }
function setLastFreeOpen(ts) { try { localStorage.setItem(FREE_CASE_KEY, String(ts)); } catch (e) {} }
function canOpenFree() { return Date.now() - getLastFreeOpen() >= FREE_CASE_COOLDOWN; }

let freeTimerInterval = null;
function startFreeTimer() {
  stopFreeTimer();
  const el = $('freeTimer');
  const btn = $('freeCaseBtn');
  if (!el) return;

  const update = () => {
    if (canOpenFree()) {
      el.innerHTML = '<div style="color:var(--green);font-weight:700;font-size:15px;">Готов к открытию!</div>';
      if (btn) { btn.disabled = false; btn.textContent = '🎁 Открыть'; }
      stopFreeTimer();
      return;
    }
    const remaining = FREE_CASE_COOLDOWN - (Date.now() - getLastFreeOpen());
    const h = Math.floor(remaining / 3600000);
    const m = Math.floor((remaining % 3600000) / 60000);
    const s = Math.floor((remaining % 60000) / 1000);
    const cell = (n, l) => `<div class="timer-cell"><div class="num">${String(n).padStart(2, '0')}</div><div class="lbl">${l}</div></div>`;
    el.innerHTML = cell(h, 'час') + cell(m, 'мин') + cell(s, 'сек');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Скоро'; }
  };
  update();
  if (!canOpenFree()) freeTimerInterval = setInterval(update, 1000);
}
function stopFreeTimer() {
  if (freeTimerInterval) { clearInterval(freeTimerInterval); freeTimerInterval = null; }
}

function pickWeighted(items) {
  const total = items.reduce((sum, it) => sum + RARITIES[it.rarity].weight, 0);
  let r = Math.random() * total;
  for (const it of items) {
    r -= RARITIES[it.rarity].weight;
    if (r <= 0) return it;
  }
  return items[items.length - 1];
}

const caseModal = $('caseModal');
let caseAnimTimer = null;
let spinning = false;

function openCase() {
  if (!canOpenFree()) { showToast('Бесплатный кейс ещё не готов!', 'error'); return; }
  setLastFreeOpen(Date.now()); // фиксируем сразу, чтобы нельзя было закрыть и открыть снова
  spinning = true;

  const items = FREE_CASE.items;
  const track = $('rouletteTrack');
  const result = $('rouletteResult');
  const closeBtn = $('closeCaseBtn');
  $('rouletteCaseName').textContent = FREE_CASE.name;

  result.classList.remove('show');
  closeBtn.style.display = 'none';
  track.classList.remove('animate');
  track.style.transform = 'translateX(0)';

  const win = pickWeighted(items);
  const TOTAL = 60, WIN_INDEX = 52;
  const strip = [];
  for (let i = 0; i < TOTAL; i++) {
    strip.push(i === WIN_INDEX ? win : items[Math.floor(Math.random() * items.length)]);
  }
  track.innerHTML = strip.map((it) => `
    <div class="roulette-item rar-${it.rarity}">
      <div class="item-emoji">${it.emoji}</div>
      <div class="item-name">${it.name}</div>
    </div>`).join('');

  caseModal.classList.add('active');
  document.body.style.overflow = 'hidden';

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const wrap = track.parentElement;
      const winEl = track.children[WIN_INDEX];
      const jitter = (Math.random() - 0.5) * winEl.offsetWidth * 0.7;
      const offset = wrap.clientWidth / 2 - (winEl.offsetLeft + winEl.offsetWidth / 2) + jitter;
      track.classList.add('animate');
      track.style.transform = `translateX(${offset}px)`;

      caseAnimTimer = setTimeout(() => {
        $('resEmoji').textContent = win.emoji;
        $('resName').textContent = win.name;
        $('resRarity').textContent = RARITIES[win.rarity].name;
        $('resultCard').style.borderColor = `var(--r-${win.rarity})`;
        result.classList.add('show');
        closeBtn.style.display = 'inline-flex';
        spinning = false;
        spawnConfetti();
        startFreeTimer();
      }, 5200);
    });
  });
}

function closeCaseModal() {
  if (spinning) return;
  caseModal.classList.remove('active');
  document.body.style.overflow = '';
  clearTimeout(caseAnimTimer);
}

function spawnConfetti() {
  const colors = ['#a855f7', '#c084fc', '#d946ef', '#8b5cf6', '#22d3ee'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.style.cssText = `position:fixed;top:-20px;width:9px;height:13px;z-index:600;pointer-events:none;
      left:${Math.random() * 100}vw;background:${colors[Math.floor(Math.random() * colors.length)]};
      animation:confettiFall ${2 + Math.random() * 1.5}s linear forwards;`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

/* =====================================================================
   ЧАТ: живого оператора нет, поэтому чат честно направляет в Telegram
   ===================================================================== */
const chatWidget = $('chatWidget');
const chatFab = $('chatFab');
const chatMessages = $('chatMessages');
const chatInput = $('chatInput');

function toggleChat() {
  const open = !chatWidget.classList.contains('active');
  chatWidget.classList.toggle('active', open);
  chatFab.classList.toggle('open', open);
  chatFab.textContent = open ? '×' : '💬';
  if (open) {
    chatMessages.scrollTop = chatMessages.scrollHeight;
    if (window.innerWidth > 768) chatInput.focus();
  }
}

function addChatMessage(html, sender) {
  const div = document.createElement('div');
  div.className = `chat-msg ${sender}`;
  const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  div.innerHTML = `<div class="msg-bubble">${html}</div><div class="msg-time">${time}</div>`;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function sendChatMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  addChatMessage(escapeHtml(text), 'user'); // текст пользователя всегда экранируем
  chatInput.value = '';
  setTimeout(() => {
    addChatMessage(`Онлайн-чат пока не подключён. Напишите нам в Telegram, там отвечают администраторы: <a href="${CONFIG.support}" target="_blank" rel="noopener">${CONFIG.support}</a>`, 'support');
  }, 600);
}

/* =====================================================================
   ЗАПУСК
   ===================================================================== */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  closeModal();
  closeCaseModal();
  if (chatWidget.classList.contains('active')) toggleChat();
});

$('navOnline').textContent = SERVERS.reduce((sum, s) => sum + s.players, 0);
addChatMessage('Привет! По вопросам покупок и банов пишите сюда или сразу в Telegram.', 'support');

window.addEventListener('hashchange', () => renderPage(true));
renderPage(false);
</script>
