let toastTimer;
function showToast(msg, type = 'success') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  showToast(`IP скопирован: ${text}`);
}

function serverCardHtml(s) {
  const pct = Math.round(s.players / s.max * 100);
  const state = s.players === 0 ? 'empty' : s.players >= s.max ? 'full' : '';
  return `
    <div class="server-card">
      <div class="server-bg bg-${s.bg}"></div>
      <div class="server-content">
        <div>
          <div class="server-title">${esc(s.name)}</div>
          <div class="server-map">${esc(s.map)}</div>
        </div>
        <div>
          <div class="server-status ${state}">${s.players}/${s.max}${state === 'full' ? ' · полный' : ''}</div>
          <div class="server-bar"><span style="width:${pct}%"></span></div>
          <div class="server-actions">
            <a class="srv-btn play" href="steam://connect/${s.ip}">▶ Играть</a>
            <button class="srv-btn" data-copy="${s.ip}" title="Скопировать IP">IP</button>
          </div>
        </div>
      </div>
    </div>`;
}

const pageRoot = $('page-root');
let currentPath = null;

function parseHash() {
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, query = ''] = raw.split('?');
  return { path, query };
}

function renderPage(animate = true) {
  let { path, query } = parseHash();
  if (!pages[path]) path = '/404';

  const doRender = () => {
    pageRoot.className = path === '/' ? 'main-container' : '';
    pageRoot.innerHTML = pages[path]();
    if (animate) {
      void pageRoot.offsetWidth;
      pageRoot.classList.add('entering');
      setTimeout(() => pageRoot.classList.remove('entering'), 750);
    }
    window.scrollTo({ top: 0, behavior: 'instant' });

    document.querySelectorAll('.nav-links a').forEach(a => a.classList.toggle('active', a.dataset.route === path));
    document.title = path === '/' ? 'BAZA — сервера Counter-Strike 2' : `BAZA — ${pageRoot.querySelector('h1')?.textContent || ''}`;

    stopSlider(); stopFreeTimer();
    if (path === '/') startSlider();
    if (path === '/shop' && query === 'cases') switchShopTab('cases');
    currentPath = path;
  };

  if (!currentPath || !animate) return doRender();
  pageRoot.classList.add('leaving');
  setTimeout(() => { pageRoot.classList.remove('leaving'); doRender(); }, 340);
}

document.addEventListener('click', (e) => {
  const t = e.target;

  const copyBtn = t.closest('[data-copy]');
  if (copyBtn) return copyText(copyBtn.dataset.copy);

  const period = t.closest('#donatorsToggle button');
  if (period) {
    document.querySelectorAll('#donatorsToggle button').forEach(b => b.classList.toggle('active', b === period));
    $('donatorsList').innerHTML = donatorsHtml(period.dataset.period);
    return;
  }

  const arrow = t.closest('.slider-arrows button');
  if (arrow) { setSlide(slideIndex + Number(arrow.dataset.dir)); restartSliderTimer(); return; }
  const dot = t.closest('#sliderDots button');
  if (dot) { setSlide(Number(dot.dataset.slide)); restartSliderTimer(); return; }

  const faq = t.closest('.faq-q');
  if (faq) {
    const item = faq.parentElement;
    document.querySelectorAll('.faq-item').forEach(i => { if (i !== item) i.classList.remove('open'); });
    item.classList.toggle('open');
    return;
  }

  const tab = t.closest('.shop-tab');
  if (tab) return switchShopTab(tab.dataset.tab);

  const buy = t.closest('[data-buy]');
  if (buy) return openModal(buy.dataset.buy);

  const caseBtn = t.closest('[data-case]');
  if (caseBtn) return openCase(caseBtn.dataset.case);
});

    const q = e.target.value.trim().toLowerCase();
    $('bansBody').innerHTML = bansRowsHtml(BANS.filter(b => b.n.toLowerCase().includes(q)));
  }
});
